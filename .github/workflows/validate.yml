name: Validate entries

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check every entry's frontmatter
        run: python scripts/validate_entries.py entries
      - name: Entry PRs change only entries/
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'kb/')
        run: |
          outside=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '^entries/' || true)
          if [ -n "$outside" ]; then
            echo "A kb/ pull request may only change files in entries/. These are outside it:"
            echo "$outside"
            exit 1
          fi
